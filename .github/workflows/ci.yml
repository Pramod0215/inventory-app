name: CI and container images

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            clientapp/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Check backend JavaScript syntax
        run: find backend/src backend/scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run backend unit tests
        run: npm --prefix backend run test:coverage -- --reporter=json --outputFile=../backend-test-results.json

      - name: Install frontend dependencies
        run: npm ci --prefix clientapp

      - name: Run frontend unit tests
        run: npm --prefix clientapp run test:coverage -- --reporter=json --outputFile=../clientapp-test-results.json

      - name: Enforce minimum test case count
        run: node scripts/check-test-count.mjs 60 backend-test-results.json clientapp-test-results.json

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            backend/coverage/
            clientapp/coverage/
          if-no-files-found: warn

      - name: Build frontend
        run: npm --prefix clientapp run build

      - name: Validate Docker Compose
        run: docker compose config --quiet

  publish:
    name: Build and publish container images
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image names and tags
        id: meta
        shell: bash
        run: |
          image_prefix="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "backend=$image_prefix-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$image_prefix-frontend" >> "$GITHUB_OUTPUT"

      - name: Generate backend image tags
        id: backend-tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.backend }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Generate frontend image tags
        id: frontend-tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.frontend }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.backend-tags.outputs.tags }}

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: clientapp/Dockerfile
          push: true
          build-args: VITE_API_URL=/api/v1
          tags: ${{ steps.frontend-tags.outputs.tags }}
