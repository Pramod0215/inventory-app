apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-seed
  namespace: inventory-app
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: catalog-seed
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongodb 27017; do echo waiting for mongodb; sleep 2; done"]
      containers:
        - name: seed
          image: ghcr.io/pramod0215/inventory-app-backend:latest
          imagePullPolicy: Always
          command: ["npm", "run", "seed"]
          envFrom:
            - secretRef:
                name: inventory-app-secrets
