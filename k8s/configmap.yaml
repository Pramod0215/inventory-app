apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-app-config
  namespace: inventory-app
data:
  PORT: "5000"
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_TOPIC: "commerce.events"
  KAFKA_CLIENT_ID: "commerce-api"
  KAFKA_GROUP_ID: "commerce-event-consumers"
  HF_MODEL: "Qwen/Qwen2.5-7B-Instruct"
