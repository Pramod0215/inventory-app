version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: inventory-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: inventory_app

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inventory-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/inventory_app
      JWT_SECRET: inventory_secret_key_2026
    ports:
      - '5000:5000'
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      dockerfile: clientapp/Dockerfile
    container_name: inventory-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:5000/api/v1
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  mongo-data:
